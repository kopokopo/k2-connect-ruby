name: Release

on:
  push:
    branches: [master]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.13"
          bundler-cache: true
      - run: bundle exec rspec

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # trusted publishing (OIDC)
      contents: write   # push the git tag
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.13"
          bundler-cache: true

      - name: Skip if this version is already released
        id: check
        run: |
          VERSION=$(ruby -Ilib -e 'require "k2-connect-ruby/version"; puts K2ConnectRuby::VERSION')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already tagged, skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rubygems/release-gem@v1
        if: steps.check.outputs.skip != 'true'